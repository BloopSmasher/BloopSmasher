name: Update SVG with Weather

permissions:
  contents: write

on:
  schedule:
   - cron: '30 18 * * *'  # 12:00 AM IST
   - cron: '30 6  * * *'  # 12:00 AM IST
   
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  update-svg:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get Weather and Update SVG
        run: |
          export TZ=Asia/Kolkata
          DAY=$(date '+%A')

          TEMP=$(curl -s 'wttr.in/Raipur?m&format=%t' | sed 's/[^0-9\-]//g')

          if [ -z "$TEMP" ]; then
            TEMP="23"
          fi

          echo "Day: $DAY"
          echo "Temperature: ${TEMP}°C"

          sed -i.bak -E \
            "s/(It's )[0-9]+(°C here in C.G, India today\.)/\1$TEMP\2/" canimate.svg

          sed -i.bak -E \
            "s/(Have a great ).*(\.)/\1$DAY\2/" canimate.svg
            
          rm -f canimate.svg.bak

      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add canimate.svg
          git commit -m "Update weather and day [skip ci]" || echo "No changes"
          git push
