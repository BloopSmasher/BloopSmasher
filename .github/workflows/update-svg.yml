name: Update SVG with Weather

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  update-svg:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get Weather and Update SVG
        run: |
          export TZ=Asia/Kolkata
          DAY=$(date '+%A')

          TEMP=$(curl -s 'wttr.in/Raipur?m&format=%t' | sed 's/[^0-9\-]//g')

          if [ -z "$TEMP" ]; then
            TEMP="23"
          fi

          echo "Day: $DAY"
          echo "Temperature: ${TEMP}°C"

          sed -i.bak "s/{{TEMPERATURE}}/$TEMP/g" canimate.svg
          sed -i.bak "s/{{DAY}}/$DAY/g" canimate.svg
          rm -f canimate.svg.bak

      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add canimate.svg
          git commit -m "Update weather and day [skip ci]" || echo "No changes"
          git push
